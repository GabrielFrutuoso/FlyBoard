name: Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (leave empty to release the current version in tauri.conf.json)"
        required: false

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for feature commit
        id: feature
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git log --format=%s "$BEFORE_SHA..$AFTER_SHA" | grep -Eq '^feat(\([^)]*\))?!?:[[:space:]]'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No conventional feat commit found; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump application version
        if: ${{ steps.feature.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm version minor --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];

          const tauriPath = 'src-tauri/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = version;
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          for (const path of ['src-tauri/Cargo.toml', 'src-tauri/Cargo.lock']) {
            const contents = fs.readFileSync(path, 'utf8');
            const updated = path.endsWith('Cargo.toml')
              ? contents.replace(/^(version = ")[^"]+("\n)/m, `$1${version}$2`)
              : contents.replace(/(name = "FlyBoard"\nversion = ")[^"]+("\n)/, `$1${version}$2`);
            fs.writeFileSync(path, updated);
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v$VERSION [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Could not push the release commit after 3 attempts."
              exit 1
            fi
          done

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          FEATURE_RELEASE: ${{ steps.feature.outputs.should_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && "$FEATURE_RELEASE" != "true" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
            EXISTING=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            EXISTING=true
          else
            # Auto-release on main: the version was bumped for a feat commit.
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
            EXISTING=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$EXISTING" = false ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; version not bumped, skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "needs_tag=$([ "$EXISTING" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: ${{ steps.resolve.outputs.needs_tag == 'true' }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create Release
        id: create-release
        if: ${{ steps.resolve.outputs.should_release == 'true' }}
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `FlyBoard ${tag}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            });
            return data.id;

  build-release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    if: ${{ needs.create-release.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            build-essential

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 3
          args: --target ${{ matrix.target }}
          updaterJsonPreferNsis: true

  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    if: ${{ needs.create-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false
            });

  notify-discord:
    name: Notify Discord
    needs: [create-release, publish-release]
    if: ${{ needs.create-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Discord webhook
        id: discord_webhook
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post release to Discord
        if: ${{ steps.discord_webhook.outputs.configured == 'true' }}
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        with:
          script: |
            const releaseId = process.env.RELEASE_ID;
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!releaseId || !webhook) {
              core.warning('Missing RELEASE_ID or DISCORD_WEBHOOK_URL; skipping Discord notification.');
              return;
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(releaseId),
            });

            // Discord limits: content <= 2000 chars; embed description <= 4096 chars.
            const truncate = (s, n) => (s && s.length > n ? `${s.slice(0, n - 3)}...` : (s || ''));
            const description = truncate(release.body, 4000);

            const payload = {
              content: '||@everyone||',
              embeds: [
                {
                  title: release.name || release.tag_name,
                  url: release.html_url,
                  description,
                  color: 2105893,
                  footer: { text: 'Changelog' },
                },
              ],
            };

            const resp = await fetch(webhook, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!resp.ok) {
              const text = await resp.text().catch(() => '');
              core.setFailed(`Discord webhook failed: ${resp.status} ${resp.statusText} ${text}`.trim());
            }
